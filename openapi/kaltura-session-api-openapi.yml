openapi: 3.2.0
info:
  title: Kaltura Session API
  version: '1.0'
  description: 'Operations tagged session across 2 of this provider''s published API definitions: ott.openapi.json, ovp.openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tvpapi-us-preprod.ott.kaltura.com/api_v3
- url: http://tvpapi-us-preprod.ott.kaltura.com/api_v3
- url: https://www.kaltura.com/api_v3
- url: http://www.kaltura.com/api_v3
security:
- ks: []
tags:
- name: Session
paths:
  /service/session/action/get:
    post:
      description: Parses KS
      operationId: session.get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KalturaSession'
            text/xml:
              schema:
                $ref: '#/components/schemas/KalturaSession'
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters:
      - session
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OTTRequest'
              properties:
                session:
                  type: string
              type: object
      summary: Session get
      x-summary-source: derived
    servers:
    - url: https://tvpapi-us-preprod.ott.kaltura.com/api_v3
    - url: http://tvpapi-us-preprod.ott.kaltura.com/api_v3
  /service/session/action/revoke:
    post:
      description: Revokes all the sessions (KS) of a given user
      operationId: session.revoke
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
            text/xml:
              schema:
                type: boolean
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OTTRequest'
              properties: {}
              type: object
      summary: Session revoke
      x-summary-source: derived
    servers:
    - url: https://tvpapi-us-preprod.ott.kaltura.com/api_v3
    - url: http://tvpapi-us-preprod.ott.kaltura.com/api_v3
  /service/session/action/switchUser:
    post:
      description: Switching the user in the session by generating a new session for a new user within the same household
      operationId: session.switchUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KalturaLoginSession'
            text/xml:
              schema:
                $ref: '#/components/schemas/KalturaLoginSession'
        x-Errors:
          description: '* `UserNotActivated`: undefined'
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters:
      - userIdToSwitch
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OTTRequest'
              properties:
                userIdToSwitch:
                  type: string
              type: object
      summary: Session switch user
      x-summary-source: derived
    servers:
    - url: https://tvpapi-us-preprod.ott.kaltura.com/api_v3
    - url: http://tvpapi-us-preprod.ott.kaltura.com/api_v3
  /service/session/action/end:
    post:
      description: End a session with the Kaltura server, making the current KS invalid.
      operationId: session.end
      parameters:
      - $ref: '#/components/parameters/ks'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/clientTag'
      - $ref: '#/components/parameters/partnerId'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/responseProfile'
      responses:
        '200':
          description: Success
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters: []
      summary: Session end
      x-summary-source: derived
    servers:
    - url: https://www.kaltura.com/api_v3
    - url: http://www.kaltura.com/api_v3
  /service/session/action/impersonate:
    post:
      description: 'Start an impersonated session with Kaltura''s server.


        The result KS is the session key that you should pass to all services that requires a ticket.'
      operationId: session.impersonate
      parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/clientTag'
      - $ref: '#/components/parameters/partnerId'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/responseProfile'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
        x-Errors:
          description: '* `START_SESSION_ERROR`: Error while starting session for partner [@PID@]'
      security: []
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters:
      - secret
      - impersonatedPartnerId
      - userId
      - type
      - partnerId
      - expiry
      - privileges
      requestBody:
        content:
          application/json:
            schema:
              properties:
                expiry:
                  default: 86400
                  type: integer
                impersonatedPartnerId:
                  type: integer
                partnerId:
                  type: integer
                privileges:
                  type: string
                secret:
                  type: string
                  x-inputType: password
                type:
                  default: 0
                  enum:
                  - 0
                  - 2
                  type: integer
                  x-enumLabels:
                  - USER
                  - ADMIN
                  x-enumType: KalturaSessionType
                userId:
                  type: string
              required:
              - secret
              - impersonatedPartnerId
              type: object
      summary: Session impersonate
      x-summary-source: derived
    servers:
    - url: https://www.kaltura.com/api_v3
    - url: http://www.kaltura.com/api_v3
  /service/session/action/impersonateByKs:
    post:
      description: 'Start an impersonated session with Kaltura''s server.


        The result KS info contains the session key that you should pass to all services that requires a ticket.


        Type, expiry and privileges won''t be changed if they''re not set'
      operationId: session.impersonateByKs
      parameters:
      - $ref: '#/components/parameters/ks'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/clientTag'
      - $ref: '#/components/parameters/partnerId'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/responseProfile'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KalturaSessionInfo'
        x-Errors:
          description: '* `START_SESSION_ERROR`: Error while starting session for partner [@PID@]'
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters:
      - session
      - type
      - expiry
      - privileges
      requestBody:
        content:
          application/json:
            schema:
              properties:
                expiry:
                  type: integer
                privileges:
                  type: string
                session:
                  type: string
                type:
                  enum:
                  - 0
                  - 2
                  type: integer
                  x-enumLabels:
                  - USER
                  - ADMIN
                  x-enumType: KalturaSessionType
              required:
              - session
              type: object
      summary: Session impersonate by ks
      x-summary-source: derived
    servers:
    - url: https://www.kaltura.com/api_v3
    - url: http://www.kaltura.com/api_v3
  /service/session/action/start:
    post:
      description: 'Start a session with Kaltura''s server.


        The result KS is the session key that you should pass to all services that requires a ticket.'
      operationId: session.start
      parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/clientTag'
      - $ref: '#/components/parameters/partnerId'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/responseProfile'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
        x-Errors:
          description: '* `START_SESSION_ERROR`: Error while starting session for partner [@PID@]'
      security: []
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters:
      - secret
      - userId
      - type
      - partnerId
      - expiry
      - privileges
      requestBody:
        content:
          application/json:
            schema:
              properties:
                expiry:
                  default: 86400
                  type: integer
                partnerId:
                  type: integer
                privileges:
                  type: string
                secret:
                  type: string
                  x-inputType: password
                type:
                  default: 0
                  enum:
                  - 0
                  - 2
                  type: integer
                  x-enumLabels:
                  - USER
                  - ADMIN
                  x-enumType: KalturaSessionType
                userId:
                  type: string
              required:
              - secret
              type: object
      summary: Session start
      x-summary-source: derived
    servers:
    - url: https://www.kaltura.com/api_v3
    - url: http://www.kaltura.com/api_v3
  /service/session/action/startWidgetSession:
    post:
      description: Start a session for Kaltura's flash widgets
      operationId: session.startWidgetSession
      parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/clientTag'
      - $ref: '#/components/parameters/partnerId'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/responseProfile'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KalturaStartWidgetSessionResponse'
        x-Errors:
          description: '* `INVALID_WIDGET_ID`: Unknown widget [@WIDGET_ID@]

            * `MISSING_KS`: Missing KS, session not established

            * `INVALID_KS`: Invalid KS "@KSID@", Error "@ERR_CODE@,@ERR_DESC@"

            * `START_WIDGET_SESSION_ERROR`: error while starting session for widget id [@WIDGET_ID@]'
      security: []
      tags:
      - Session
      x-kaltura-format: post
      x-kaltura-parameters:
      - widgetId
      - expiry
      requestBody:
        content:
          application/json:
            schema:
              properties:
                expiry:
                  default: 86400
                  type: integer
                widgetId:
                  type: string
              required:
              - widgetId
              type: object
      summary: Session start widget session
      x-summary-source: derived
    servers:
    - url: https://www.kaltura.com/api_v3
    - url: http://www.kaltura.com/api_v3
