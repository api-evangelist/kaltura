  name: Kaltura Jobs API
  description: "batch service lets you handle different batch process from remote machines.\n As opposed\
    \ to other objects in the system, locking mechanism is critical in this case.\n For this reason the\
    \ GetExclusiveXX, UpdateExclusiveXX and FreeExclusiveXX actions are important for the system's integrity.\n\
    \ In general - updating batch object should be done only using the UpdateExclusiveXX which in turn\
    \ can be called only after \n acuiring a batch objet properly (using  GetExclusiveXX).\n If an object\
    \ was aquired and should be returned to the pool in it's initial state - use the FreeExclusiveXX action\
    \ \n Terminology:\n LocationId\n ServerID\n ParternGroups"
