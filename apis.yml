- aid: kaltura:kaltura-batch-api
  name: Kaltura batch API
  description: >-
    batch service lets you handle different batch process from remote machines.
     As opposed to other objects in the system, locking mechanism is critical in this case.
     For this reason the GetExclusiveXX, UpdateExclusiveXX and FreeExclusiveXX actions are important for
    the system's integrity.
     In general - updating batch object should be done only using the UpdateExclusiveXX which in turn
    can be called only after
     acquiring a batch object properly (using  GetExclusiveXX).
     If an object was acquired and should be returned to the pool in it's initial state - use the FreeExclusiveXX
    action
     Terminology:
     LocationId
     ServerID
     ParternGroups
  humanURL: https://developer.kaltura.com/
  baseURL: https://www.kaltura.com/api_v3
